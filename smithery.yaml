# Smithery configuration — https://smithery.ai/docs/config
# Lets Smithery run and index the GBLIN MCP server (stdio, npm package).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      gblinRpcUrl:
        type: string
        description: Optional RPC URL for Base mainnet. Falls back to a public endpoint when not set.
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@gblin-protocol/mcp-server'],
      env: config.gblinRpcUrl ? { GBLIN_RPC_URL: config.gblinRpcUrl } : {}
    })
